<svg xmlns="http://www.w3.org/2000/svg" width="400" height="690" viewBox="0 0 400 690" role="img" aria-labelledby="title desc"><title id="title">Guido costmap geometry</title><desc id="desc">Explanatory schematic with 5 cm cells, an occupied obstacle cell, a 15 cm inflation radius, and the configured 24 by 16 cm robot footprint. Not a recorded map or a reproduction of discrete Nav2 costs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f0c75e" stroke-width="1.5"/></marker></defs><rect width="400" height="690" fill="#081521"/><text x="200" y="36" font-family="Arial, sans-serif" font-size="22" fill="#f0c75e" text-anchor="middle">COSTMAP GEOMETRY</text><text x="200" y="70" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Schematic · not recorded map data</text><rect x="20" y="102" width="360" height="280" fill="#112335"/><path d="M20 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M40 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M60 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M80 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M100 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M120 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M140 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M160 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M180 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M200 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M220 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M240 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M260 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M280 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M300 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M320 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M340 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M360 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M380 102V382" stroke="#778da9" stroke-opacity=".22"/><path d="M20 102H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 122H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 142H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 162H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 182H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 202H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 222H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 242H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 262H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 282H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 302H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 322H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 342H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 362H380" stroke="#778da9" stroke-opacity=".22"/><path d="M20 382H380" stroke="#778da9" stroke-opacity=".22"/><circle cx="110" cy="242" r="60" fill="#f0c75e" opacity=".12"/><circle cx="110" cy="242" r="40" fill="#f0c75e" opacity=".15"/><circle cx="110" cy="242" r="20" fill="#f0c75e" opacity=".2"/><rect x="100" y="232" width="20" height="20" fill="#f0c75e"/><circle cx="110" cy="242" r="60" fill="none" stroke="#f0c75e" stroke-dasharray="4 4"/><path d="M110 242V182" stroke="#f0c75e" stroke-width="2"/><rect x="238" y="210" width="96" height="64" fill="#778da9" fill-opacity=".4" stroke="#f4efdc" stroke-width="2"/><path d="M268 242H311" stroke="#f4efdc" stroke-width="2"/><path d="M303 234L311 242L303 250" fill="none" stroke="#f4efdc" stroke-width="2"/><text x="110" y="166" font-family="Arial, sans-serif" font-size="20" fill="#f0c75e" text-anchor="middle">0.15 m</text><text x="286" y="194" font-family="Arial, sans-serif" font-size="20" fill="#f4efdc" text-anchor="middle">0.24 m</text><text x="286" y="306" font-family="Arial, sans-serif" font-size="20" fill="#f4efdc" text-anchor="middle">0.16 m wide</text><text x="200" y="424" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">One grid cell = 0.05 m</text><text x="200" y="460" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Yellow cell: occupied observation</text><text x="200" y="496" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Shading: increasing obstacle cost</text><text x="200" y="532" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Outline: rectangular robot footprint</text><text x="200" y="593" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Inflation is measured from obstacles,</text><text x="200" y="623" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">not outward from the robot body.</text><text x="200" y="659" font-family="Arial, sans-serif" font-size="20" fill="#8ea2b3" text-anchor="middle">Exact cell costs are not shown.</text></svg>
