<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1050" viewBox="0 0 400 1050" role="img" aria-labelledby="title desc"><title id="title">Guido perception and state inputs</title><desc id="desc">The frontier launch uses LD19 scans and EKF odometry transforms in SLAM Toolbox, which supplies map and map-to-odom to Nav2. Separate IMU packets are not emitted by the checked-in firmware.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f0c75e" stroke-width="1.5"/></marker></defs><rect width="400" height="1050" fill="#081521"/><text x="200" y="36" font-family="Arial, sans-serif" font-size="22" fill="#f0c75e" text-anchor="middle">PERCEPTION + POSE</text><rect x="22" y="62" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="92" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">LD19 → ldlidar_node</text><text x="200" y="118" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">USB serial · 230400 baud</text><path d="M200 152V202" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="214" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="244" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">/ldlidar_node/scan</text><text x="200" y="270" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">LaserScan · ldlidar_link</text><path d="M200 304V354" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="366" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="396" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">slam_toolbox</text><text x="200" y="422" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Scans + odometry TF</text><path d="M200 456V506" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="518" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="548" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">/map + map → odom</text><text x="200" y="574" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Occupancy grid + correction</text><path d="M200 608V650" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="662" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="692" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">Nav2 costmaps</text><text x="200" y="718" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Global: map · local: odom</text><text x="200" y="798" font-family="Arial, sans-serif" font-size="22" fill="#f0c75e" text-anchor="middle">THE ODOMETRY INPUT</text><text x="200" y="838" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Encoders + gyro → Arduino</text><text x="200" y="870" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">ODOM → guido_serial_bridge</text><text x="200" y="902" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">/odom → ekf_filter_node</text><text x="200" y="934" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">odom → base_footprint TF</text><text x="200" y="990" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Separate /imu/data_raw input:</text><text x="200" y="1019" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">configured; firmware packet missing</text></svg>
