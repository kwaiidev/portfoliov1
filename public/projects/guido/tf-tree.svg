<svg xmlns="http://www.w3.org/2000/svg" width="400" height="955" viewBox="0 0 400 955" role="img" aria-labelledby="title desc"><title id="title">Guido TF tree</title><desc id="desc">SLAM owns map to odom. The EKF owns odom to base_footprint in frontier mode. The URDF provides fixed joints to base_link, ldlidar_base and ldlidar_link. Offsets are committed values, not verified measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f0c75e" stroke-width="1.5"/></marker></defs><rect width="400" height="955" fill="#081521"/><text x="200" y="36" font-family="Arial, sans-serif" font-size="21" fill="#f0c75e" text-anchor="middle">ONE OWNER PER TRANSFORM</text><rect x="22" y="62" width="356" height="55" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="92" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">map</text><rect x="22" y="206" width="356" height="55" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="236" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">odom</text><rect x="22" y="350" width="356" height="55" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="380" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">base_footprint</text><rect x="22" y="494" width="356" height="55" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="524" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">base_link</text><rect x="22" y="638" width="356" height="55" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="668" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">ldlidar_base</text><rect x="22" y="782" width="356" height="55" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="812" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">ldlidar_link</text><path d="M200 123V152" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="184" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">SLAM Toolbox · dynamic</text><path d="M200 267V296" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="328" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">EKF · dynamic¹</text><path d="M200 411V440" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="472" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">URDF · fixed · z = 0.05 m</text><path d="M200 555V584" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="616" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">URDF · fixed · z = 1.0 m</text><path d="M200 699V728" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="760" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">URDF · fixed · z = 0.02745 m</text><text x="200" y="891" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">¹ Without EKF, the serial bridge</text><text x="200" y="919" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">owns odom → base_footprint.</text></svg>
