<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1210" viewBox="0 0 400 1210" role="img" aria-labelledby="title desc"><title id="title">Nav2 to physical wheel commands</title><desc id="desc">NavigateToPose uses NavFn A-star and DWB, then cmd_vel_raw feeds velocity_smoother and cmd_vel_nav. A mux or forwarding bridge leads to cmd_vel, serial wheel PWM, Arduino and the drivetrain. The direct explorer bypasses this Nav2 control path.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f0c75e" stroke-width="1.5"/></marker></defs><rect width="400" height="1210" fill="#081521"/><text x="200" y="36" font-family="Arial, sans-serif" font-size="22" fill="#f0c75e" text-anchor="middle">GOAL → PHYSICAL MOTION</text><rect x="22" y="62" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="92" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">/navigate_to_pose</text><text x="200" y="118" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">bt_navigator</text><path d="M200 158V194" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="206" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="236" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">planner_server</text><text x="200" y="262" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">NavFn · A* global route</text><path d="M200 302V338" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="350" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="380" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">controller_server</text><text x="200" y="406" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">DWB · local trajectories</text><path d="M200 446V482" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="494" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="524" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">velocity_smoother</text><text x="200" y="550" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">/cmd_vel_raw → /cmd_vel_nav</text><path d="M200 590V626" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="638" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="668" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">Mux or forwarding bridge</text><text x="200" y="694" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Launch-dependent routing</text><path d="M200 734V770" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="782" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="812" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">guido_serial_bridge</text><text x="200" y="838" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">/cmd_vel → signed wheel PWM</text><path d="M200 878V914" stroke="#f0c75e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="926" width="356" height="90" rx="5" fill="#112335" stroke="#778da9"/><text x="200" y="956" font-family="Arial, sans-serif" font-size="22" fill="#f4efdc" text-anchor="middle">Arduino → motor driver</text><text x="200" y="982" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Left / right drive channels</text><text x="200" y="1064" font-family="Arial, sans-serif" font-size="21" fill="#f0c75e" text-anchor="middle">Feedback: encoders + gyro</text><text x="200" y="1096" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Arduino → ODOM → ROS /odom</text><text x="200" y="1148" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">Direct explorer commands bypass</text><text x="200" y="1178" font-family="Arial, sans-serif" font-size="20" fill="#c8d2d6" text-anchor="middle">DWB and the velocity smoother.</text></svg>
